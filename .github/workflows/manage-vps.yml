name: Manage VPS

on:
  push:
    paths:
      - '.github/vps-command.sh'
  workflow_dispatch:
    inputs:
      command:
        description: 'Shell command to run on VPS'
        required: true
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Execute on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.command || 'bash -e /dev/stdin' }}
        env:
          SCRIPT_CONTENT: ${{ github.event_name == 'push' && 'cat .github/vps-command.sh' || '' }}

      - name: Execute script file on VPS
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script_path: .github/vps-command.sh
