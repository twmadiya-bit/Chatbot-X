name: Manage VPS

on:
  push:
    paths:
      - '.github/vps-command.sh'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "=== SSH OK ===" && whoami && pm2 list && docker ps --format 'table {{.Names}}\t{{.Status}}'
